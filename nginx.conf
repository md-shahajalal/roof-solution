server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular is a single-page app: unknown paths must return index.html, not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build output is immutable, so cache it hard.
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(?:png|jpe?g|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # index.html must never be cached or users get stale bundle references.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
